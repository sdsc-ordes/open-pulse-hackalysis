name: normal
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: lint
        run: just lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: build
        run: just build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: test
        run: just test
